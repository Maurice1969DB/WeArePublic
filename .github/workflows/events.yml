name: Check for Events and Send Email

on:
  schedule:
    - cron: '0 * * * *'  # ⏰ elk uur op :00 UTC
  workflow_dispatch:      # 🔘 handmatig starten mogelijk via GitHub

permissions:
  contents: write

concurrency:
  group: events-checker
  cancel-in-progress: false

jobs:
  check-events:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo ophalen
        uses: actions/checkout@v4

      - name: 🐍 Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Afhankelijkheden installeren
        run: pip install requests

      - name: ▶️ Run events_checker.py
        run: python events_checker.py
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

      - name: 💾 Commit seen_events.json
        run: |
          if [ ! -f seen_events.json ]; then
            echo "Geen seen_events.json om te committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_events.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in seen_events.json."
            exit 0
          fi
          git commit -m "Update seen events [bot]"
          git push
